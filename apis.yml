name: Octarine
description: 'Octarine was a cloud-native application security startup that built a
  security platform for Kubernetes and service-mesh environments, providing runtime
  visibility, policy enforcement, and threat detection for containerized workloads
  and microservices. Backed by Accel and Samsung NEXT, Octarine was acquired by VMware
  in May 2020 and its technology was folded into VMware Carbon Black Cloud and the
  Tanzu portfolio to deliver Kubernetes and container security. As an independent
  company Octarine no longer operates a public developer or API surface; its former
  domain octarinesec.com no longer resolves. This profile is retained in the API
  Evangelist network as a portfolio-company / acquisition record rather than an
  active API provider.'
